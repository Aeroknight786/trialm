name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go mod verify
      - name: dependency vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go vet ./...
      - run: go test -race ./...
      # Live smoke test of detection on each OS (fixtures cover the parsers;
      # this exercises the real probes, e.g. on Apple Silicon runners).
      - name: detect (live)
        run: go run ./cmd/trialm detect
      - name: predict (what-if)
        run: go run ./cmd/trialm predict gpt-oss:20b --device "RTX 4090" --ram 64

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
      - name: installer syntax
        run: sh -n install.sh
